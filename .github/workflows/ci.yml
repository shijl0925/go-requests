name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      httpbin:
        image: kennethreitz/httpbin@sha256:599fe5e5073102dbb0ee3dbb65f049dab44fa9fc251f6835c9990f8fb196a72b
        ports:
          - 8080:80

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1

      - name: Wait for httpbin
        run: |
          for i in {1..30}; do
            if curl -fsS "$HTTPBIN_BASE_URL/get" >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "httpbin did not become ready" >&2
          exit 1
        env:
          HTTPBIN_BASE_URL: http://127.0.0.1:8080

      - name: Run integration tests
        run: go test -tags=integration ./... -count=1 -timeout 120s
        env:
          HTTPBIN_BASE_URL: http://127.0.0.1:8080

  benchmark:
    name: NewSession vs NewFastSession benchmarks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Run session comparison benchmarks
        run: |
          go test -run '^$' -bench 'Benchmark(NewSessionGet|NewFastSessionGet)$' -benchmem -count=5 ./... | tee /tmp/session-benchmarks.txt
          {
            echo "## NewSession vs NewFastSession benchmarks"
            echo
            echo '```text'
            cat /tmp/session-benchmarks.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
