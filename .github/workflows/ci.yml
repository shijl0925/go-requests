name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
          cache: true

      - name: Run unit tests
        run: go test ./... -count=1

      - name: Run integration tests
        run: go test -tags=integration ./... -run TestHTTPBinIntegration -count=1 -timeout 90s
